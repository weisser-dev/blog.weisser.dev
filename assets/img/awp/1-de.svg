<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 410" role="img" aria-labelledby="title desc"><title id="title">EIN WORKFLOW ALS GEMEINSAMER VERTRAG</title><desc id="desc">AWP beschreibt den Ablauf und seine Grenzen. Eine Runtime muss diese Regeln durchsetzen.</desc><rect width="1050" height="410" rx="24" fill="#f4f7fb"/><path d="M0 0h1050v9H0z" fill="#526d8f"/><text x="42" y="55" fill="#50647e" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">EIN WORKFLOW ALS GEMEINSAMER VERTRAG</text><text x="42" y="94" fill="#17283f" font-family="Arial,sans-serif" font-size="25" font-weight="700">AWP beschreibt den Ablauf und seine Grenzen</text><rect x="42" y="135" width="305" height="155" rx="14" fill="#fff" stroke="#d8e1ec"/><rect x="62" y="155" width="34" height="4" rx="2" fill="#4773a3"/><text x="62" y="192" fill="#1b314c" font-family="Arial,sans-serif" font-size="18" font-weight="700">WORKFLOW</text><text x="62" y="226" fill="#52667e" font-family="Arial,sans-serif" font-size="16"><tspan x="62" dy="0">Agenten · Werkzeuge · Schritte</tspan></text><rect x="372" y="135" width="305" height="155" rx="14" fill="#fff" stroke="#d8e1ec"/><rect x="392" y="155" width="34" height="4" rx="2" fill="#687fc5"/><text x="392" y="192" fill="#1b314c" font-family="Arial,sans-serif" font-size="18" font-weight="700">LEITPLANKEN</text><text x="392" y="226" fill="#52667e" font-family="Arial,sans-serif" font-size="16"><tspan x="392" dy="0">Rechte · Budget · Freigaben</tspan></text><rect x="702" y="135" width="305" height="155" rx="14" fill="#fff" stroke="#d8e1ec"/><rect x="722" y="155" width="34" height="4" rx="2" fill="#378b85"/><text x="722" y="192" fill="#1b314c" font-family="Arial,sans-serif" font-size="18" font-weight="700">NACHWEISE</text><text x="722" y="226" fill="#52667e" font-family="Arial,sans-serif" font-size="16"><tspan x="722" dy="0">Ereignisse · Entscheidungen ·</tspan><tspan x="722" dy="22">Audit</tspan></text><circle cx="51" cy="345" r="5" f