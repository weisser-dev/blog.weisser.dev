<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 410" role="img" aria-labelledby="title desc"><title id="title">PROTOKOLLE ERGÄNZEN SICH</title><desc id="desc">Verschiedene Fragen, verbundene Systeme. Jede Ebene hat eine eigene Verantwortung.</desc><rect width="1050" height="410" rx="24" fill="#f4f7fb"/><path d="M0 0h1050v9H0z" fill="#526d8f"/><text x="42" y="55" fill="#50647e" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">PROTOKOLLE ERGÄNZEN SICH</text><text x="42" y="94" fill="#17283f" font-family="Arial,sans-serif" font-size="25" font-weight="700">Verschiedene Fragen, verbundene Systeme</text><rect x="42" y="135" width="305" height="155" rx="14" fill="#fff" stroke="#d8e1ec"/><rect x="62" y="155" width="34" height="4" rx="2" fill="#4773a3"/><text x="62" y="192" fill="#1b314c" font-family="Arial,sans-serif" font-size="18" font-weight="700">AWP</text><text x="62" y="226" fill="#52667e" font-family="Arial,sans-serif" font-size="16"><tspan x="62" dy="0">Wie wird der Workflow definiert</tspan><tspan x="62" dy="22">und gesteuert?</tspan></text><rect x="372" y="135" width="305" height="155" rx="14" fill="#fff" stroke="#d8e1ec"/><rect x="392" y="155" width="34" height="4" rx="2" fill="#687fc5"/><text x="392" y="192" fill="#1b314c" font-family="Arial,sans-serif" font-size="18" font-weight="700">MCP</text><text x="392" y="226" fill="#52667e" font-family="Arial,sans-serif" font-size="16"><tspan x="392" dy="0">Wie greifen Agenten auf</tspan><tspan x="392" dy="22">Werkzeuge zu?</tspan></text><rect x="702" y="135" width="305" height="155" rx="14" fill="#fff" stroke="#d8e1ec"/><rect x="722" y="155" width="34" height="4" rx="2" fill="#378b85"/><text x="722" y="192" fill="#1b314c" font-family="Arial,sans-serif" font-size="18" font-weight="700">A2A</text><text x="722" y="226" fill="#52667e" font-family="Arial,sans-serif" font-size="16"><tspan x="722" dy="0">Wie kommunizieren Agenten</tspan><tspan x="722" dy="22">miteinander?</tspan></text><circle cx="51" cy="345" r="5" fill="#4773a3"/><text x="68" y="351" fill="#52667e" font-family="Arial,sans-serif" font-size="16">Jede Ebene hat eine eigene Verantwortung.</text></svg>